# Lint rules are pinned here so CI and local runs agree whatever ruff version is installed.
target-version = "py313"
line-length = 140

[lint]
select = [
  "E4", "E7", "E9", "F",  # pycodestyle errors and pyflakes (ruff's classic defaults)
  "I",                    # import sorting
  "UP",                   # modern Python syntax
  "RUF",                  # ruff-specific checks
]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
